#
# Lily58 / nice!nano v2
# Performance-first configuration
#

# ============================================================
# ENCODERS
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# ============================================================
# DISPLAY
#
# Desabilitado deliberadamente.
# OLED/LVGL adiciona processamento e work queues concorrentes.
# ============================================================

CONFIG_ZMK_DISPLAY=n


# ============================================================
# POWER MANAGEMENT
#
# Sem deep sleep.
# Energia não é prioridade neste teclado.
# ============================================================

CONFIG_ZMK_SLEEP=n


# ============================================================
# BATTERY REPORTING
#
# Desabilitado para eliminar polling/work desnecessário.
# ============================================================

CONFIG_ZMK_BATTERY_REPORTING=n


# ============================================================
# BLUETOOTH / RADIO
# ============================================================

CONFIG_ZMK_BLE=y

# Ajustes experimentais do ZMK voltados a estabilidade de BLE.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Máxima potência de transmissão do nRF52840.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Preferimos robustez/compatibilidade a PHY 2 Mbps.
CONFIG_BT_CTLR_PHY_2M=n


# ============================================================
# BLE HOST CONNECTION
# ============================================================

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Nunca pular connection events deliberadamente.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# 4 segundos supervision timeout.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400


# ============================================================
# BLE THREAD
# ============================================================

# Default ZMK = 768.
# Mais margem de stack.
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1024

# Default = 5.
# Número menor = prioridade maior no Zephyr.
CONFIG_ZMK_BLE_THREAD_PRIORITY=4


# ============================================================
# BLE REPORT QUEUES
# ============================================================

# Default teclado BLE = 20.
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=64

# Default consumer reports = 5.
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=16


# ============================================================
# MATRIX / INPUT QUEUE
# ============================================================

# Default ZMK = 4.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=32


# ============================================================
# BEHAVIOR QUEUE
#
# Há combos, hold-taps e macros no keymap.
# Mais margem para bursts.
# ============================================================

CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128


# ============================================================
# LOGGING
# ============================================================

CONFIG_ZMK_LOGGING_MINIMAL=y
